# Environment for the notebooks and validation analyses in the manuscript.
# Notebooks import the frozen v1 code in src/. Versions match the preprint environment.
name: roseate-analysis
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - pip
  # Notebooks
  - jupyterlab=4.4.9
  - notebook=7.4.7
  - nglview=3.1.1
  # Python libraries
  - numpy=1.23.5
  - pandas=1.5.3
  - scipy=1.15.3
  - scikit-learn=1.4.1.post1
  - biopython=1.79
  - joblib=1.3.2
  - tqdm=4.66.1
  - pyyaml=6.0.1
  - pytorch=2.3.0
  - statsmodels=0.14.1
  - glmnet=2.2.1                 # used by the v1 notebooks
  - hyperopt=0.2.7               # Table S2 hyperparameter searches
  - pygam=0.9.1
  - openpyxl=3.1.5
  - matplotlib-base=3.8.2
  - seaborn=0.13.1
  - dna_features_viewer
  - iteround
  - r-bayestestr
  # Sequence analysis
  - mafft=7.525
  - trimal=1.5.0
  - cd-hit=4.8.1
  - hmmer=3.4
  - prodigal=2.6.3
  - seqtk=1.5
  - parallel
  - mmseqs2=17.b804f
  - spades=4.2.0
  - clipkit=1.4.1
  - kmc=3.2.4
  - foldmason
  - orthofinder
  # Phylogenetics
  - ete3=3.1.3
  - gotree=0.4.5
  - goalign=0.3.7
  - pastml=1.9.50
  # Metagenome download and QC (versions from Methods; not in the preprint environment)
  - fastp=1.0.1
  - sra-tools=3.3.0
  # Data transfer and utilities
  - globus-cli
  - jsonapi-client
  - fuzzywuzzy
  - pip:
      - fair-esm==2.0.0
      - freesasa==2.2.1