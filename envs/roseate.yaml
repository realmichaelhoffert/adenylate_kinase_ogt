# Environment for the roseate package and its tests.
# Versions match the preprint environment (reference/v1_preprint/env/conda-list.txt).
name: roseate
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - pip
  # Python libraries
  - numpy=1.23.5
  - pandas=1.5.3
  - scipy=1.15.2
  - scikit-learn=1.4.1.post1     # the archived model pickles need this version
  - biopython=1.79
  - joblib=1.3.2
  - tqdm=4.66.1
  - pyyaml=6.0.1
  - pytorch=2.3.0                # MSA Transformer; also the NN in the phylogenetic CV
  - statsmodels=0.14.1           # LM in the phylogenetic CV
  - matplotlib-base=3.8.2
  - seaborn=0.13.1
  - pytest
  # External tools called by roseate.extract and roseate.align
  - mafft=7.525
  - hmmer=3.4
  - prodigal=2.6.3
  - seqtk=1.5
  - parallel
  - mmseqs2=17.b804f
  - pip:
      - fair-esm==2.0.0          # not on conda-forge