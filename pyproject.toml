[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "roseate"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
   "numpy<2",                     # scikit-learn 1.4.1 predates numpy 2
   "pandas",
   "scipy",
   "scikit-learn==1.4.1.post1",   # pinned: the archived pickles need it
   "biopython",
   "joblib",
   "tqdm",
   "pyyaml",
]
[project.scripts]
roseate = "roseate.cli:main"

[tool.setuptools]
packages = ["roseate"]
include-package-data = false

# [tool.setuptools.packages.find]
# include = ["roseate*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: loads large embedding files"]

[project.optional-dependencies]
embed = ["torch", "fair-esm==2.0.0"]
pcv   = ["torch", "statsmodels"]      # NN and LM models in the phylogenetic CV
plots = ["matplotlib", "seaborn"]
test  = ["pytest"]