[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "roseate"
version = "0.1.0"
requires-python = ">=3.10"

[project.scripts]
roseate = "roseate.cli:main"

[tool.setuptools]
packages = ["roseate"]
include-package-data = false

# [tool.setuptools.packages.find]
# include = ["roseate*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: loads large embedding files"]